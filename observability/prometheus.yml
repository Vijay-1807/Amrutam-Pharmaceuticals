global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: telemedicine-backend

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: telemedicine-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['app:3000']
        labels:
          env: production

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
