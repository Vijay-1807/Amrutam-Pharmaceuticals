name: CI

on:
  push:
    branches: [main, base_setup]
  pull_request:
    branches: [main, base_setup]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck & build
        run: npm run build

      - name: Unit & integration tests (embedded Postgres/Redis)
        env:
          JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789abcdef
          JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef0123456789abcdef
          ENCRYPTION_KEY: ci-encryption-key-0123456789abcdef
        run: npm test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: amrutam/telemedicine-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name smoke \
            -e NODE_ENV=production \
            -e DATABASE_URL="postgresql://postgres:postgres@localhost:5432/telemedicine?schema=public" \
            -e JWT_ACCESS_SECRET=ci-access-secret-0123456789abcdef0123456789abcdef \
            -e JWT_REFRESH_SECRET=ci-refresh-secret-0123456789abcdef0123456789abcdef \
            -e ENCRYPTION_KEY=ci-encryption-key-0123456789abcdef \
            -p 3000:3000 amrutam/telemedicine-backend:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              echo "health OK"; docker logs smoke | tail -5; exit 0
            fi
            sleep 2
          done
          echo "container failed health check"; docker logs smoke; exit 1
